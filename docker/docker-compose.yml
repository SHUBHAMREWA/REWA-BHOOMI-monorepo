version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rewa_bhoomi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rewabhoomi
      POSTGRES_PASSWORD: rewabhoomi_dev
      POSTGRES_DB: rewabhoomi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rewabhoomi']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rewa_bhoomi_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
